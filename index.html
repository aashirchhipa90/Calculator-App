
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <div class="display">
            <div class="expression" id="expression"></div>
            <input type="text" id="input" value="0" readonly>
        </div>

        <div class="buttons">

            <button class="function" onclick="allClear()">AC</button>
            <button class="function" onclick="toggleSign()">+/−</button>
            <button class="function" onclick="percentage()">%</button>
            <button class="operator" onclick="addValue('/')">÷</button>

            <button onclick="addValue('7')">7</button>
            <button onclick="addValue('8')">8</button>
            <button onclick="addValue('9')">9</button>
            <button class="operator" onclick="addValue('*')">×</button>

            <button onclick="addValue('4')">4</button>
            <button onclick="addValue('5')">5</button>
            <button onclick="addValue('6')">6</button>
            <button class="operator" onclick="addValue('-')">−</button>

            <button onclick="addValue('1')">1</button>
            <button onclick="addValue('2')">2</button>
            <button onclick="addValue('3')">3</button>
            <button class="operator" onclick="addValue('+')">+</button>

            <button class="zero" onclick="addValue('0')">0</button>
            <button onclick="addValue('.')">,</button>
            <button class="operator" onclick="calculate()">=</button>

        </div>

    </div>

    <script src="app.js"></script>

</body>
</html>
